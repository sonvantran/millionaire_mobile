name: millionaire_mobile
description: A new Flutter project.
publish_to: 'none'
version: 1.0.17+36
# flutter pub run build_runner build --delete-conflicting-outputs
# dart run flutter_native_splash:create
# flutter build appbundle --flavor prod lib/main_prod.dart --release./gradlew build
environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.2
  flutter_svg: 2.0.5
  intl: 0.18.1
  flutter_bloc: 8.1.2
  auto_route: 5.0.4
  dio: 5.1.2
  freezed_annotation: 2.2.0
  json_annotation: 4.8.0
  logger: 1.3.0
  freezed: 2.3.4
  flutter_localizations:
    sdk: flutter
  json_serializable: 6.6.0
  share: 2.0.4
  fl_chart: 0.63.0
  google_mobile_ads: 4.0.0
  path_provider: 2.1.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_spinkit: 5.2.0
  firebase_core: 2.16.0
  firebase_analytics: 10.4.5
  android_id: 0.3.5
  in_app_review: 2.0.6
  sqflite: 2.3.0
  path: 1.8.3
  cloud_firestore: 4.9.2
  volume_controller: 2.0.7
  shared_preferences: 2.2.2
  sky_ads:
    git:
      url: https://github.com/thiepcong/ads-admob.git
  url_launcher: 6.2.3
  flutter_native_splash: 2.3.10
  firebase_messaging: 14.6.8
  flutter_local_notifications: 16.3.2
  firebase_remote_config: 4.2.6
  flutter_screenutil: 5.9.0
  cached_network_image: 3.3.1
  firebase_crashlytics: 3.3.6
  flutter_easyloading: 3.0.5
  firebase_storage: 11.2.7
  connectivity_plus: 5.0.2
  just_audio: 0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 2.0.0
  build_runner: 2.3.3
  hive_generator: 2.0.1
  rename: 2.1.1
  auto_route_generator: 5.0.3


flutter_native_splash:
  background_image: "assets/images/ic_splash.png"
  background_image_dark: "assets/images/ic_splash.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/call_help/
    - assets/images/dong_hanh/
    - assets/images/ndh/
    - assets/audios/
    - assets/audios/lvs/
    - assets/audios/gsx/
    - assets/audios/pd/
  fonts:
    - family: SVN
      fonts:
        - asset: assets/font/SVN-Merge Bold.otf