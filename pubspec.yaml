name: millionaire_game
description: A new Flutter project.
publish_to: 'none'
version: 1.1.6+51
# flutter pub run build_runner build --delete-conflicting-outputs
# dart run flutter_native_splash:create
# flutter build appbundle --flavor prod lib/main_prod.dart --release./gradlew build
# flutter run --flavor prod -t lib/main_prod.dart --release
environment:
  sdk: ^3.10.0   # ĐỔI: main.dart dùng dot-shorthands, cần Dart >= 3.10

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: "1.0.8"
  flutter_svg: 2.0.10+1
  intl: ^0.20.3
  flutter_bloc: "8.1.6"
  auto_route: "9.2.1+1"
  dio: "5.6.0"
  freezed_annotation: "2.4.4"
  json_annotation: "4.9.0"
  logger: "2.4.0"
  flutter_localizations:
      sdk: flutter
  fl_chart: "0.68.0"
  google_mobile_ads: "5.1.0"
  path_provider: "2.1.4"
  hive: "2.2.3"
  hive_flutter: "1.1.0"
  flutter_spinkit: "5.2.1"
  android_id: "0.4.0"
  in_app_review: "2.0.9"
  sqflite: "2.3.3+1"
  path: "1.9.1"
  volume_controller: "2.0.8"
  shared_preferences: "2.3.2"
  url_launcher: "6.3.0"
  flutter_native_splash: "2.4.1"
  flutter_local_notifications: "17.2.2"
  flutter_screenutil: "5.9.3"
  cached_network_image: "3.4.1"
  connectivity_plus: "6.0.5"
  # just_audio: "0.9.37"
  flutter_dotenv: "5.1.0"
  fluttertoast: ^10.0.2
  share_plus: "10.0.2"
  timezone: "0.9.4"
  audioplayers: "5.2.1"
  sky_ads:
    path: ../sky_ads

  # ĐỔI: nâng nhóm Firebase lên bản có hỗ trợ web build được
  firebase_core: ^4.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.0.0
  firebase_remote_config: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_firestore: ^6.0.0
  web_socket_channel: ^3.0.3
  flutter_fortune_wheel: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: "4.0.0"
  rename: "3.0.2"


flutter_native_splash:
  background_image: "assets/images/ic_splash.png"
  background_image_dark: "assets/images/ic_splash.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/call_help/
    - assets/images/dong_hanh/
    - assets/images/ndh/
    - assets/audios/
    - assets/audios/lvs/
    - assets/audios/gsx/
    - assets/audios/pd/
    - assets/db/
    - environment_dev.env
    - environment_prod.env
  fonts:
    - family: SVN
      fonts:
        - asset: assets/font/SVN-Merge Bold.otf