    - assets/images/ndh/
    - assets/audios/
    - assets/audios/lvs/
    - assets/audios/gsx/
    - assets/audios/pd/
    - environment_dev.env
    - environment_prod.env
  fonts:
    - family: SVN
      fonts:
        - asset: assets/font/SVN-Merge Bold.otf